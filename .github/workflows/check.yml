name: Check

on:
    push:
        branches: ["**"]
    pull_request:
        branches: ["**"]

jobs:
    check:
        runs-on: ubuntu-latest

        strategy:
            matrix:
                node-version: [22.x, 24.x]

        steps:
            - uses: actions/checkout@v4
            - name: Use Node.js ${{ matrix.node-version }}
              uses: actions/setup-node@v4
              with:
                  node-version: ${{ matrix.node-version }}
                  cache: "npm"
            - run: npm ci
            # typecheck + lint + unit tests. The live CouchDB suite is not run
            # here; it needs a server and credentials.
            - run: npm run check
            - run: npm run build
